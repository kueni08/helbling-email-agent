# Helbling & Co. AG — E-Mail-Verarbeitungssystem Konfiguration

# Pfade
paths:
  inbox: "./inbox"
  knowledge_base: "./knowledge_base"
  output: "./output"
  archive: "./archive"

# Anthropic API
api:
  model: "claude-sonnet-4-20250514"
  max_tokens: 2000
  temperature: 0.3

# Firma
company:
  name: "Helbling & Co. AG"
  domains:
    - "helbling.ch"
    - "helbling-co.ch"
  erpnext_url: ""  # z.B. https://erp.helbling.ch

# Klassifikation
classification:
  default_bereich: "ALLGEMEIN"
  keywords_sibox:
    - "sibox"
    - "schlüsseldepot"
    - "schlüssel depot"
    - "notöffnung"
    - "schliesszylinder"
    - "schliessanlage"
    - "keso"
    - "kaba"
    - "sea"
    - "profilzylinder"
    - "zugangskontrolle"
  keywords_facettestar:
    - "facettestar"
    - "entgrat"
    - "anfas"
    - "chamfer"
    - "deburr"
    - "entgraten"
    - "anfasen"
    - "gratfrei"

# Aufgaben
tasks:
  default_zugewiesen: "Kueni"
  nachfass_tage: 3
  prioritaet_mapping:
    REKLAMATION: "hoch"
    ANGEBOT_ANFRAGE: "hoch"
    BESTELLUNG: "hoch"
    TERMIN: "mittel"
    NACHFASSEN: "mittel"
    ANFRAGE: "mittel"
    INFO: "niedrig"
    INTERN: "niedrig"

# Entwürfe
drafts:
  templates_dir: "./templates/drafts"
  format: "html"
  sprache: "de-CH"
  stil: "professionell-freundlich"
  default_signatur: "standard"
  signaturen:
    standard:
      name: "Helbling & Co. AG"
      text: |
        Freundliche Grüsse

        Helbling & Co. AG
        Werkstrasse 18
        8645 Rapperswil-Jona
        Tel. +41 55 225 55 00
        info@helbling.ch
        www.helbling.ch
      html: |
        <p>Freundliche Grüsse</p>
        <p><strong>Helbling &amp; Co. AG</strong><br>
        Werkstrasse 18<br>
        8645 Rapperswil-Jona<br>
        Tel. +41 55 225 55 00<br>
        <a href="mailto:info@helbling.ch">info@helbling.ch</a><br>
        <a href="https://www.helbling.ch">www.helbling.ch</a></p>
    sibox:
      name: "SIBOX – Helbling & Co. AG"
      text: |
        Freundliche Grüsse

        SIBOX – Helbling & Co. AG
        Werkstrasse 18
        8645 Rapperswil-Jona
        Tel. +41 55 225 55 00
        sibox@helbling.ch
        www.sibox.ch
      html: |
        <p>Freundliche Grüsse</p>
        <p><strong>SIBOX – Helbling &amp; Co. AG</strong><br>
        Werkstrasse 18<br>
        8645 Rapperswil-Jona<br>
        Tel. +41 55 225 55 00<br>
        <a href="mailto:sibox@helbling.ch">sibox@helbling.ch</a><br>
        <a href="https://www.sibox.ch">www.sibox.ch</a></p>
    facettestar:
      name: "FACETTESTAR – Helbling & Co. AG"
      text: |
        Freundliche Grüsse

        FACETTESTAR – Helbling & Co. AG
        Werkstrasse 18
        8645 Rapperswil-Jona
        Tel. +41 55 225 55 00
        facettestar@helbling.ch
        www.facettestar.ch
      html: |
        <p>Freundliche Grüsse</p>
        <p><strong>FACETTESTAR – Helbling &amp; Co. AG</strong><br>
        Werkstrasse 18<br>
        8645 Rapperswil-Jona<br>
        Tel. +41 55 225 55 00<br>
        <a href="mailto:facettestar@helbling.ch">facettestar@helbling.ch</a><br>
        <a href="https://www.facettestar.ch">www.facettestar.ch</a></p>
  # Mapping: Bereich → Signatur (automatische Vorauswahl)
  bereich_signatur_mapping:
    SIBOX: "sibox"
    FACETTESTAR: "facettestar"
    ALLGEMEIN: "standard"

# Verarbeitungs-Pipeline
pipeline:
  steps:
    - name: "parse"
      label: "Parsen"
      description: "E-Mail parsen (Header, Body, Anhänge)"
      module: "eml_parser"
    - name: "thread_analyze"
      label: "Thread"
      description: "Thread-Verlauf analysieren"
      module: "thread_analyzer"
    - name: "classify"
      label: "Klassifikation"
      description: "Bereich & Aktionstyp bestimmen"
      module: "classifier"
    - name: "knowledge"
      label: "Wissen"
      description: "Relevante Wissensbasis-Einträge suchen"
      module: "knowledge"
    - name: "draft"
      label: "Entwurf"
      description: "Antwortentwurf generieren (HTML)"
      module: "drafter"
      condition: "benoetigt_antwort"
    - name: "task"
      label: "Aufgabe"
      description: "Aufgabe erstellen"
      module: "tasker"
      condition: "benoetigt_aufgabe"

# Web-Scraping
web_sources:
  - name: "Helbling Homepage"
    url: "https://www.helbling.ch"
    crawl_depth: 2
    include_patterns:
      - "/produkte/"
      - "/dienstleistungen/"
      - "/ueber-uns/"
      - "/kontakt/"
    exclude_patterns:
      - "/blog/"
      - "/impressum/"
      - "/datenschutz/"
    category: "allgemein"
    refresh_interval_hours: 168
  - name: "SIBOX Website"
    url: "https://www.sibox.ch"
    crawl_depth: 2
    include_patterns:
      - "*"
    exclude_patterns: []
    category: "sibox"
    refresh_interval_hours: 168
  - name: "FACETTESTAR Website"
    url: "https://www.facettestar.ch"
    crawl_depth: 3
    include_patterns:
      - "*"
    exclude_patterns:
      - "/impressum/"
      - "/datenschutz/"
    category: "facettestar"
    refresh_interval_hours: 168

  - name: "Helbling Website"
    url: "https://www.helbling.net"
    crawl_depth: 3
    include_patterns:
      - "*"
    exclude_patterns:
      - "/impressum/"
      - "/datenschutz/"
      - "/agb/"
    category: "allgemein"
    refresh_interval_hours: 168

# Knowledge Base
knowledge:
  chunk_size: 1000       # Zeichen pro Chunk
  chunk_overlap: 200     # Überlappung
  top_k: 5              # Anzahl Chunks für Kontext
  min_relevance: 0.1    # Minimaler Relevanz-Score

# Dashboard
dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false
  auto_refresh_seconds: 30

# Logging
logging:
  level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  file: "./output/logs/processing.log"
